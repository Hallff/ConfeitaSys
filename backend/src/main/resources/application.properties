# ====================================================================
#  ConfeitaSys API - configuracoes
#  (arquivo lido como ISO-8859-1: evite acentos nos valores)
# ====================================================================

server.port=8080
spring.application.name=confeitasys-api

# --- Banco de dados PostgreSQL (criado pelos scripts da pasta banco/)
spring.datasource.url=jdbc:postgresql://localhost:5432/confeitasys
spring.datasource.username=confeitasys
spring.datasource.password=confeitasys
spring.datasource.hikari.maximum-pool-size=5

# --- Swagger / OpenAPI
#  Tela:      http://localhost:8080/swagger-ui.html
#  Contrato:  http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Ordem fixa na tela do Swagger: grupos 1..8 e rotas pela ordem do caminho (= numero da API)
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.docExpansion=list
springdoc.swagger-ui.defaultModelsExpandDepth=0
springdoc.swagger-ui.persistAuthorization=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.default-produces-media-type=application/json

# --- ConfeitaSys
# Origens (enderecos do frontend) autorizadas a chamar a API (CORS)
confeitasys.cors.origens=http://localhost:*,http://127.0.0.1:*
# Tempo de validade do login (token), em horas
confeitasys.sessao.horas=12
# Pastas onde ficam os backups (.sql) e os relatorios salvos (.html)
confeitasys.pasta-backup=backup
confeitasys.pasta-relatorios=relatorios
