<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConfeitaSys</title>
  <link rel="icon" href="img/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<div class="app">

  <!-- Barra lateral esquerda -->
  <nav class="lateral" aria-label="Menu principal">
    <div class="logo" title="ConfeitaSys" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16l-1.5 7h-13z"/><path d="M6 13a6 6 0 0 1 12 0"/><path d="M12 7V4"/><circle cx="12" cy="3" r="1"/></svg>
    </div>

    <button class="nav-btn" data-tela="vendas" title="Vendas (tecla 1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
      Vendas
    </button>

    <!-- CADASTRO 3: Produtos do cardápio -->
    <button class="nav-btn" data-tela="produtos" title="Produtos do cardápio (tecla 2)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"/><path d="M5 21v-7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7"/><path d="M5 16c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 5 0"/><path d="M12 12V8"/><path d="M12 5.5c.8-.8.8-1.7 0-2.5-.8.8-.8 1.7 0 2.5z"/></svg>
      Produtos
    </button>

    <!-- CADASTRO 2: Botão do ESTOQUE com desenho de armário -->
    <button class="nav-btn" data-tela="estoque" title="Estoque (tecla 3)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2.5" width="16" height="17" rx="1.5"/>
        <path d="M4 7h16"/>
        <path d="M12 7v12.5"/>
        <path d="M10 4.75h4"/>
        <path d="M9.5 12v2.5M14.5 12v2.5"/>
        <path d="M6 19.5v2M18 19.5v2"/>
      </svg>
      Estoque
    </button>

    <button class="nav-btn" data-tela="relatorios" title="Relatórios (tecla 4)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 18v-3M12 18v-6M16 18v-4"/></svg>
      Relatórios
    </button>

    <div class="espaco"></div>

    <!-- CADASTRO 1: Usuário -->
    <button class="nav-btn" data-tela="conta" title="Minha conta (tecla 5)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      Conta
    </button>

    <button class="nav-btn" id="btn-backup" title="Fazer cópia de segurança dos dados">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      Backup
    </button>
    <button class="nav-btn" id="btn-sair" title="Sair do sistema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      Sair
    </button>
  </nav>

  <div class="principal">
    <!-- Topo: título à esquerda, botão + no centro, busca no canto superior direito -->
    <header class="topo">
      <div class="esq">
        <h2 id="titulo">Vendas</h2>
        <input type="date" class="entrada data-filtro" id="filtro-data" aria-label="Data das vendas">
      </div>
      <button class="btn-mais" id="btn-nova-venda" title="Registrar nova venda (tecla N)" aria-label="Registrar nova venda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="dir">
        <div class="busca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="entrada" id="busca" type="search" placeholder="Buscar: produto, nº ou hora (14h)" aria-label="Buscar">
          <button class="limpar oculto" id="limpar-busca" aria-label="Limpar busca">×</button>
        </div>
      </div>
    </header>

    <main class="conteudo" id="conteudo"></main>
  </div>
</div>

<div id="modais"></div>
<div id="alerta-global" aria-live="assertive"></div>
<div class="avisos" id="avisos" aria-live="polite"></div>

<!-- config.js: endereço da API | api.js: TODAS as chamadas ao backend (numeradas como no Swagger) -->
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
