<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ConfeitaSys — Entrar</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
<main class="pagina-login">
  <div class="cartao-login">
    <div class="marca">
      <div class="marca-icone" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h16l-1.5 7h-13z"/><path d="M6 13a6 6 0 0 1 12 0"/><path d="M12 7V4"/><circle cx="12" cy="3" r="1"/></svg>
      </div>
      <h1>ConfeitaSys</h1>
    </div>
    <p class="subtitulo" id="subtitulo">Controle de vendas e estoque da padaria</p>

    <form id="form" novalidate>
      <div id="erro" class="erro-form oculto" role="alert"></div>
      <div class="campo">
        <label for="nome">Usuário</label>
        <input class="entrada" id="nome" name="nome" autocomplete="username" required autofocus>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input class="entrada" id="senha" name="senha" type="password" autocomplete="current-password" required>
      </div>
      <div class="campo oculto" id="campo-confirmar">
        <label for="confirmar">Confirmar senha</label>
        <input class="entrada" id="confirmar" type="password" autocomplete="new-password">
        <span class="dica">Mínimo de 6 caracteres.</span>
      </div>
      <button class="btn btn-primario" id="botao" type="submit">Entrar</button>
    </form>

    <div class="seguranca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>Senha protegida com criptografia PBKDF2-SHA256.</span>
    </div>
  </div>
</main>
<script src="login.js"></script>
</body>
</html>
